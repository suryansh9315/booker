<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#F0FAF9"/>

  <!-- Document shadow -->
  <rect x="118" y="88" width="154" height="200" rx="12" fill="#0A7E72" opacity="0.12"/>

  <!-- Main document -->
  <rect x="112" y="80" width="154" height="200" rx="12" fill="white" stroke="#E5E5EA" stroke-width="1.5"/>

  <!-- Document top fold corner -->
  <path d="M236 80 L266 80 L266 92 Q266 92 254 92 L236 80Z" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="1"/>
  <path d="M236 80 L266 92" stroke="#E5E5EA" stroke-width="1.5"/>

  <!-- Medical cross -->
  <rect x="182" y="108" width="14" height="38" rx="4" fill="#0A7E72"/>
  <rect x="170" y="120" width="38" height="14" rx="4" fill="#0A7E72"/>

  <!-- Document lines - text representation -->
  <rect x="132" y="166" width="114" height="6" rx="3" fill="#E5E5EA"/>
  <rect x="132" y="180" width="90" height="6" rx="3" fill="#E5E5EA"/>
  <rect x="132" y="204" width="114" height="6" rx="3" fill="#E5E5EA"/>
  <rect x="132" y="218" width="70" height="6" rx="3" fill="#E5E5EA"/>

  <!-- Heartbeat / ECG line -->
  <polyline
    points="132,248 152,248 160,232 168,264 178,236 186,260 194,248 248,248"
    stroke="#0A7E72"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"/>

  <!-- Microphone icon — right side -->
  <circle cx="298" cy="190" r="36" fill="white" stroke="#E5E5EA" stroke-width="1.5"/>
  <!-- mic body -->
  <rect x="289" y="168" width="18" height="26" rx="9" fill="#0A7E72"/>
  <!-- mic base arc -->
  <path d="M282 190 Q282 208 298 208 Q314 208 314 190" stroke="#0A7E72" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- mic stand -->
  <line x1="298" y1="208" x2="298" y2="216" stroke="#0A7E72" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="291" y1="216" x2="305" y2="216" stroke="#0A7E72" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sound wave arcs around mic -->
  <path d="M322 178 Q330 190 322 202" stroke="#0A7E72" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M330 172 Q342 190 330 208" stroke="#0A7E72" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.25"/>

  <!-- Small decorative dots -->
  <circle cx="104" cy="160" r="5" fill="#0A7E72" opacity="0.25"/>
  <circle cx="90" cy="220" r="8" fill="#0A7E72" opacity="0.15"/>
  <circle cx="310" cy="130" r="6" fill="#0A7E72" opacity="0.2"/>
  <circle cx="285" cy="240" r="4" fill="#0A7E72" opacity="0.3"/>
</svg>
